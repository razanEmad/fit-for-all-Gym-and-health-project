<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | FIT FOR ALL</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">FIT FOR ALL</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html" class="nav-btn" data-auth="guest">Register</a>
            <a href="profile.html" data-auth="member" style="display: none;">Profile</a>
            <a href="login.html" class="nav-btn" data-auth="member" data-auth-action="logout" style="display: none;">Log Out</a>
        </div>
    </nav>

    <main class="auth-page">
        <section class="auth-card" aria-labelledby="login-title">
            <h1 id="login-title">Welcome back.</h1>
            <p>Log in to continue your fitness journey.</p>

            <form class="auth-form" id="login-form">
                <div class="form-field">
                    <label for="login-email">Email address</label>
                    <input id="login-email" name="email" type="email" autocomplete="email" required>
                </div>

                <div class="form-field">
                    <label for="login-password">Password</label>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                </div>

                <button class="auth-submit" type="submit">Log In</button>
            </form>

            <p class="auth-switch">New to FIT FOR ALL? <a href="register.html">Create an account</a></p>
        </section>
    </main>

    <script src="js/config.js"></script>

    <script>
    const loginForm = document.getElementById("login-form");

    loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;

        const formData = new URLSearchParams();

        formData.append("username", email);
        formData.append("password", password);

        try {
            const response = await fetch(
                `${API_BASE_URL}/api/auth/login`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: formData
                }
            );

            const data = await response.json();

            if (!response.ok) {
                alert(data.detail || "Login failed");
                return;
            }

            // Save JWT
            localStorage.setItem("token", data.access_token);

            alert("Login successful!");

            // Go to profile
            window.location.href = "profile.html";

        } catch (error) {
            console.error(error);
            alert("Could not connect to the server.");
        }
    });
</script>
<script src="js/nav.js"></script>
</body>

</html>
